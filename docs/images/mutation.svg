<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">
<style>
text{fill:#1f2328}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.box{fill:#f6f8fa;stroke:#d0d7de}
.changed{fill:#cf222e;font-weight:600}
.killed{fill:#dafbe1;stroke:#4ac26b}
.lived{fill:#ffebe9;stroke:#ff8182}
.line{stroke:#57606a;fill:none;stroke-width:1.5}
.head{fill:#57606a}
.sub{fill:#57606a;font-size:12px}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.box{fill:#161b22;stroke:#30363d}
.changed{fill:#ff7b72}
.killed{fill:#033a16;stroke:#2ea043}
.lived{fill:#490202;stroke:#f85149}
.line{stroke:#8b949e}
.head{fill:#8b949e}
.sub{fill:#8b949e}
}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="box" x="20" y="20" width="250" height="44" rx="6"/>
<text class="code" x="34" y="47">case version <tspan class="changed">&lt;=</tspan> 9 {</text>
<text class="sub" x="20" y="84">one operator changed (was &lt;)</text>
<rect class="box" x="320" y="20" width="120" height="44" rx="6"/><text x="380" y="47" text-anchor="middle">gleam test</text>
<path class="line" marker-end="url(#m)" d="M270 42H318"/>
<path class="line" marker-end="url(#m)" d="M440 36L498 22"/>
<path class="line" marker-end="url(#m)" d="M440 48L498 72"/>
<rect class="killed" x="500" y="6" width="200" height="34" rx="6"/><text x="512" y="28">a test fails: killed</text>
<rect class="lived" x="500" y="56" width="200" height="34" rx="6"/><text x="512" y="78">all pass: lives</text>
<text x="20" y="128" font-weight="600">A survivor means one of two things</text>
<text x="20" y="152">A test is missing: add one that fails for the mutant.</text>
<text x="20" y="174">The change cannot be observed: list it in the baseline and say why.</text>
</svg>
