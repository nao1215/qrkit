<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">
<style>
text{fill:#1f2328}
.sub{fill:#57606a;font-size:12px}
.pr{fill:#ddf4ff;stroke:#54aeff}
.night{fill:#fff8c5;stroke:#d4a72c}
.week{fill:#fbefff;stroke:#c297ff}
.axis{stroke:#d0d7de}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.sub{fill:#8b949e}
.pr{fill:#0c2d6b;stroke:#1f6feb}
.night{fill:#3b2e00;stroke:#9e6a03}
.week{fill:#2d1b4e;stroke:#8957e5}
.axis{stroke:#30363d}
}
</style>
<text x="20" y="24" font-weight="600">What each layer asks, and when it runs</text>
<rect class="pr" x="20" y="44" width="16" height="12" rx="2"/><text class="sub" x="42" y="55">every pull request</text>
<rect class="night" x="170" y="44" width="16" height="12" rx="2"/><text class="sub" x="192" y="55">nightly, larger</text>
<rect class="week" x="320" y="44" width="16" height="12" rx="2"/><text class="sub" x="342" y="55">weekly, every module</text>
<line class="axis" x1="20" y1="72" x2="700" y2="72"/>
<rect class="pr" x="20" y="84" width="230" height="36" rx="6"/><text x="32" y="107">Examples and regressions</text>
<text x="270" y="101">Is this matrix what ISO/IEC 18004 prints?</text><text class="sub" x="270" y="116">qrkit_test, decode_test, readme_examples_test, regression_*</text>
<rect class="pr" x="20" y="128" width="190" height="36" rx="6"/><rect class="night" x="210" y="128" width="40" height="36" rx="6"/><text x="32" y="151">Properties</text>
<text x="270" y="145">Does every input round-trip, in every family?</text><text class="sub" x="270" y="160">property_test, metamorphic_test (metamon)</text>
<rect class="pr" x="20" y="172" width="230" height="36" rx="6"/><text x="32" y="195">Snapshots</text>
<text x="270" y="189">Did the terminal or SVG output change?</text><text class="sub" x="270" y="204">snapshot_test (birdie)</text>
<rect class="pr" x="20" y="216" width="190" height="36" rx="6"/><rect class="night" x="210" y="216" width="40" height="36" rx="6"/><text x="32" y="239">Other readers</text>
<text x="270" y="233">Do zxing-cpp, zbar and segno agree with qrkit?</text><text class="sub" x="270" y="248">just interop, doc/interop.md</text>
<rect class="pr" x="20" y="260" width="190" height="36" rx="6"/><rect class="week" x="210" y="260" width="40" height="36" rx="6"/><text x="32" y="283">Mutants</text>
<text x="270" y="277">Would the tests notice a changed operator?</text><text class="sub" x="270" y="292">just mutation, changed modules on PRs</text>
</svg>
