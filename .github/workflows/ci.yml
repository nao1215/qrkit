name: CI

# Two compiler lanes:
# - floor (`floor`): the `gleam` requirement in gleam.toml (keep both in sync) on the
#   oldest maintained OTP and Node 22. It proves the declared minimum still builds
#   and passes the tests on both targets.
# - latest (`check`, `build-and-test`): floats on 1.x with OTP 29 so new compiler
#   warnings, deprecations and formatter changes surface here first.

on:
  push:
    branches: [main]
    paths-ignore: ["doc/**", "CHANGELOG.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["doc/**", "CHANGELOG.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format / Lint / Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - name: Download dependencies
        run: just deps
      - name: Format check
        run: just format-check
      - name: Type check
        run: just typecheck
      - name: Lint
        run: just lint
      # After editing any workflow, regenerate actions.lock with
      # `python3 .github/scripts/lock_actions.py` (needs
      # `gh extension install github/gh-actions-lock --pin v0.4.1`).
      - name: Verify workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          python3 .github/scripts/lock_actions.py --check
          gh actions-lock --verify

  floor:
    name: Test (Gleam 1.14.0, OTP 27, Node 22, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [erlang, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.target == 'javascript'
        with:
          node-version: "22"
      - name: Download dependencies
        run: gleam deps download
      - name: Test
        run: gleam test --target ${{ matrix.target }}

  build-and-test:
    name: Build and test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [erlang, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - name: Set up Node.js
        if: matrix.target == 'javascript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - name: Download dependencies
        run: just deps
      - name: Build
        run: just build-${{ matrix.target }}
      - name: Test
        run: just test-${{ matrix.target }}
